id: tailscale-key-rotation
namespace: ops

description: Daily Tailscale auth-key rotation + Ubuntu node re-auth (live)

triggers:
  - id: weekly-monday
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 6 * * *"  # Daily 06:00 UTC
    timezone: "Etc/UTC"

variables:
  tailnet: "thein3rovert.github"
  gcp_project: "{{ kv('GCP_PROJECT_ID') }}"
  secret_id: "tailscale-authkey"

tasks:
  - id: working_dir
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: clone_repos
        type: io.kestra.plugin.scripts.shell.Commands
        retry:
          type: constant
          maxAttempts: 3
          interval: PT30S
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          image: willhallonline/ansible:latest
          user: "0:0"
          volumes:
            - "{{workingDir}}:{{workingDir}}"
        commands:
          - git clone --depth 1 --branch main https://github.com/thein3rovert/playbooks "{{ workingDir }}/playbooks"
          - git clone --depth 1 --branch main https://github.com/thein3rovert/infrastructure "{{ workingDir }}/infra"

      - id: dry_run_check
        type: io.kestra.plugin.scripts.shell.Commands
        retry:
          type: constant
          maxAttempts: 3
          interval: PT30S
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          image: willhallonline/ansible:latest
          user: "0:0"
          volumes:
            - "{{workingDir}}:{{workingDir}}"
        env:
          ANSIBLE_VAULT_PASSWORD: "{{ kv('ANSIBLE_VAULT_PASSWORD') }}"
          SSH_PRIVATE_KEY: "{{ kv('SSH_PRIVATE_KEY') }}"
          VAULT_ADDR: "{{ kv('VAULT_ADDR') }}"
          VAULT_TOKEN: "{{ kv('VAULT_TOKEN') }}"
        beforeCommands:
          - apk add --no-cache python3 py3-pip bash openssh-client curl jq
          - pip install --quiet --break-system-packages google-cloud-secret-manager
        commands:
          - export GOOGLE_APPLICATION_CREDENTIALS="{{workingDir}}/sa.json"
          - >-
            curl -sf -H "X-Vault-Token: $VAULT_TOKEN" "http://100.92.136.66:8200/v1/secret/data/gpc/tailscale-sa"
            | jq '.data.data | {type, project_id, private_key_id, private_key, client_email, client_id, auth_uri, token_uri, auth_provider_x509_cert_url, client_x509_cert_url, universe_domain}'
            > {{workingDir}}/sa.json
          - test -s {{workingDir}}/sa.json && echo "SA key fetched" 
          - chmod 600 {{workingDir}}/sa.json
          - mkdir -p ~/.ssh
          - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          - chmod 600 ~/.ssh/id_rsa
          - echo "$ANSIBLE_VAULT_PASSWORD" > {{workingDir}}/playbooks/.vault_pass
          - chmod 600 {{workingDir}}/playbooks/.vault_pass
          - mkdir -p /root/.config/ansible
          - echo "$ANSIBLE_VAULT_PASSWORD" > /root/.config/ansible/vault-password
          - chmod 600 /root/.config/ansible/vault-password
          - >-
            cd {{workingDir}}/playbooks &&
            ansible-playbook -i inventory/production.yml playbooks/key-rotation.yml
            --tags key-rotation
            -e rotation_dry_run=false
            -e rotation_reauth_enabled=true
            -e rotation_reauth_targets=srv-prod-01,indra,lincoln,raven,octavia
            -e rotation_discord_webhook="{{ kv('DISCORD_WEBHOOK', 'ops.monitoring') }}"
            -e rotation_script_path={{workingDir}}/infra/jobs/tailscale-key-rotation/src/rotate.py
            -e rotation_gcp_project={{ kv('GCP_PROJECT_ID') }}
            -e rotation_secret_id={{ vars.secret_id }}
            -e rotation_tailnet={{ vars.tailnet }}
        outputFiles:
          - "*.log"
