id: homelab-services-backup
namespace: ops.backup

description: >-
  Backup specific homelab services to my homelab s3 bucket, this workflow
  runs an ansible playbook that backup nixos services and container services
  to homelab garage s3 bucket.

triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 9 * * 0"
    disabled: false
    timezone: "Europe/London"

variables:
  backup_host: "100.105.187.63"
  expected_ed25519_fingerprint: "SHA256:NzrAAdiURQbcDlSe6UxRARZ6+xGb/KvLdl5TpA0PCAM"

tasks:
  - id: working_dir
    type: io.kestra.plugin.core.flow.WorkingDirectory
    tasks:
      - id: clone-repo
        type: io.kestra.plugin.git.Clone
        url: https://github.com/thein3rovert/playbooks
        branch: main

      - id: run-backup
        type: io.kestra.plugin.scripts.shell.Commands
        timeout: PT1H
        taskRunner:
          type: io.kestra.plugin.scripts.runner.docker.Docker
          image: google/cloud-sdk:alpine
          volumes:
            - "{{workingDir}}:{{workingDir}}"
        env:
          VAULT_TOKEN: "{{ kv('VAULT_TOKEN') }}"
          VAULT_ADDR: "{{ kv('VAULT_ADDR') }}"
          ANSIBLE_VAULT_PASSWORD_FILE: /root/.config/ansible/vault-password
          BACKUP_HOST: "{{ vars.backup_host }}"
          EXPECTED_HOST_FINGERPRINT: "{{ vars.expected_ed25519_fingerprint }}"
        beforeCommands:
          - apk add --no-cache bash openssh-client python3 py3-pip curl jq
          - pip install --no-cache-dir --break-system-packages ansible-core
          - ansible-galaxy collection install community.general kubernetes.core
          - mkdir -p ~/.ssh /root/.config/ansible
          - >-
            curl -sf -H "X-Vault-Token: $VAULT_TOKEN" "http://100.92.136.66:8200/v1/secret/data/ssh"
            | jq -r '.data.data."infra-private-key-main"' > ~/.ssh/id_rsa
          - chmod 600 ~/.ssh/id_rsa
          - >-
            curl -sf -H "X-Vault-Token: $VAULT_TOKEN" "http://100.92.136.66:8200/v1/secret/data/ansible"
            | jq -r '.data.data."vault-password"' > /root/.config/ansible/vault-password
          - chmod 600 /root/.config/ansible/vault-password
          - |
            set -eu
            SCANNED_KEY="$(ssh-keyscan -t ed25519 "$BACKUP_HOST" 2>/dev/null)"
            ACTUAL_FINGERPRINT="$(printf '%s\n' "$SCANNED_KEY" | ssh-keygen -lf - -E sha256 | awk '{print $2}')"

            if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_HOST_FINGERPRINT" ]; then
              echo "SSH host fingerprint mismatch for $BACKUP_HOST"
              echo "Expected: $EXPECTED_HOST_FINGERPRINT"
              echo "Actual:   $ACTUAL_FINGERPRINT"
              exit 1
            fi

            printf '%s\n' "$SCANNED_KEY" >> ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
        commands:
          - cd {{workingDir}} && ansible-playbook -i inventory/production.yml playbooks/site.yml --tags backup --limit bellamy
